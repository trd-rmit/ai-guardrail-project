          <polyline class="line2" points="506,240 538,125.6 570,125.6 602,68.4 634,68.4 666,68.4 698,68.4 730,68.4 762,68.4 794,68.4"/>
          <text class="t" x="794" y="60" text-anchor="end">Attacks missed: 0 of 7 rising to 3 of 7</text>
