          <text class="tm" x="370" y="260" text-anchor="middle">1</text>
          <text class="tm" x="210" y="282" text-anchor="middle">Threshold</text>
          <polyline class="line1" points="66,210.4 354,210.4"/>
          <polyline class="line2" points="66,169.6 354,169.6"/>
          <text class="t" x="70" y="162">Attacks missed: 3 of 17 at every threshold</text>
          <text class="t" x="70" y="203">False alarms: 5 of 68 at every threshold</text>

          <line class="grid" x1="490" y1="40" x2="810" y2="40"/>
          <line class="grid" x1="490" y1="140" x2="810" y2="140"/>
